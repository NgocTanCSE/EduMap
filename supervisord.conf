; ═══════════════════════════════════════════════════════════════════
; EduMap — supervisord configuration for HF Spaces
; Runs 4 processes: Next.js frontend (7680), NestJS backend (3000),
;   FastAPI AI (8000), OSRM local routing backend (5000)
; ═══════════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frontend]
command=node /app/frontend/node_modules/next/dist/bin/next start -H 0.0.0.0 -p 7680
directory=/app/frontend
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=node /app/backend/dist/main.js
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
; KÊ THỪA TOÀN BỘ env của container (bao gồm HF Spaces Secrets).
; Không dùng `environment=` ở đây vì supervisord sẽ BỎ QUI các biến
; không được liệt kê rõ ràng (CLOUDFLARE_API_TOKEN, JWT_SECRET, ...).
; PORT=3000 đã được đặt qua ENV trong Dockerfile.

[program:ai-service]
command=/bin/bash /app/ai-service/start.sh
directory=/app/ai-service
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
; KÊ THỪA TOÀN BỘ env của container (bao gồm HF Spaces Secrets).
; Không dùng `environment=` ở đây vì supervisord sẽ BỎ QUI các biến
; không được liệt kê rõ ràng (CLOUDFLARE_API_TOKEN, HF_TOKEN, ...).
; PYTHONPATH=... đã được đặt qua ENV trong Dockerfile.

; ═══════════════════════════════════════════════════════════════════
; OSRM Local Routing Backend (#12 SafeRoute AI — fully offline)
; Serves pre-processed Vietnam OSM graph on port 5000 inside the container.
; Replaces the public OSRM demo server (router.project-osrm.org) + ORS API.
; RAM: ~1GB (graph loaded into memory). Disk: ~500MB (baked into Docker image).
; ═══════════════════════════════════════════════════════════════════
[program:osrm]
command=/usr/local/bin/osrm-routed --algorithm=ch /app/osrm-data/vietnam.osm.pbf
directory=/app/osrm-data
autostart=true
autorestart=true
startsecs=8
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; ═══════════════════════════════════════════════════════════════════
; Job Crawler — runs daily at 02:00 UTC to fetch new jobs from ITviec
; Uses Python3 (baked in Dockerfile) + stdlib only (no pip deps)
; ═══════════════════════════════════════════════════════════════════
[program:crawler]
command=/app/scripts/run_job_crawler.sh
directory=/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",CRAWL_INTERVAL_SECONDS="86400"

; ═══════════════════════════════════════════════════════════════════
; Cron Daemon — activates crawlers/crontab for nightly feature crawls
; (00:00 feature crawlers, 01:00 Overpass POI upsert).  Replaces the old
; jobs-only run_job_crawler.sh loop as the primary scheduler; [program:crawler]
; above remains as a 24h safety-net fallback for jobs.
; ═══════════════════════════════════════════════════════════════════
[program:cron]
command=/usr/sbin/cron -f
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/cron.log
stdout_logfile_maxbytes=0
stderr_logfile=/var/log/cron.log
stderr_logfile_maxbytes=0
