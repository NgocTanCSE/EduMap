; ═══════════════════════════════════════════════════════════════════
; EduMap — supervisord configuration for HF Spaces
; Runs 3 processes: Next.js frontend (7680), NestJS backend (3000), FastAPI AI (8000)
; ═══════════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frontend]
command=node /app/frontend/node_modules/next/dist/bin/next start -H 0.0.0.0 -p 7680
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=node /app/backend/dist/main.js
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PORT=3000

[program:ai-service]
command=/bin/bash /app/ai-service/start.sh
directory=/app/ai-service
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/usr/local/lib/python3.11/site-packages",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HF_TOKEN="%(ENV_HF_TOKEN)s",HUGGING_FACE_HUB_TOKEN="%(ENV_HUGGING_FACE_HUB_TOKEN)s"

; ═══════════════════════════════════════════════════════════════════
; Job Crawler — runs daily at 02:00 UTC to fetch new jobs from ITviec
; Uses Python3 (baked in Dockerfile) + stdlib only (no pip deps)
; ═══════════════════════════════════════════════════════════════════
[program:crawler]
command=/app/scripts/run_job_crawler.sh
directory=/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",CRAWL_INTERVAL_SECONDS="86400"
