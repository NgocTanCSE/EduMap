# Hugging Face Spaces configuration for EduMap
# ============================================
# Single-container deployment running 3 services via supervisord:
#   1. Next.js frontend  — port 7680 (public)
#   2. NestJS backend    — port 3000 (internal, SQLite)
#   3. FastAPI AI svc    — port 8000 (internal)
#
# Secrets (set via HF Spaces Settings → Secrets, NOT committed to repo):
#   - JWT_SECRET               (bắt buộc, ký JWT)
#   - GOOGLE_CLIENT_ID         (bắt buộc cho đăng nhập Google OAuth)
#   - NEXT_PUBLIC_GOOGLE_CLIENT_ID (tùy chọn, fallback cho frontend config route)
#   - OPENROUTER_API_KEY       (khuyến nghị — provider CHÍNH cho LLM text generation)
#   - OPENROUTER_MODEL         (tùy chọn, model OpenRouter; mặc định deepseek/deepseek-chat)
#   - GEMINI_API_KEY           (tùy chọn — embeddings + last-resort text generation fallback)
#   - GEMINI_MODEL             (tùy chọn, CSV model Gemini; mặc định gemini-3.8-flash,...)
#   - GEMINI_EMBEDDING_MODEL   (tùy chọn, CSV model Gemini embedding)
#   - CLOUDFLARE_API_TOKEN     (tùy chọn, Cloudflare Workers AI — bị chặn TLS từ HF Spaces)
#   - CLOUDFLARE_ACCOUNT_ID    (tùy chọn, Cloudflare Workers AI)
#   - CLOUDFLARE_MODEL         (tùy chọn, CSV model Cloudflare Workers AI)
#   - CF_AI_GATEWAY_ID         (tùy chọn, ID của Cloudflare AI Gateway)
#   - CF_AI_GATEWAY_ENABLED    (tùy chọn, true/false — bật dùng AI Gateway)
#   - HF_TOKEN                 (tùy chọn, HF Inference API fallback)
#   - NVIDIA_API_KEY           (tùy chọn, NVIDIA NIM fallback)
#   - NVIDIA_CHAT_MODEL        (tùy chọn, model NVIDIA; mặc định meta/llama-3.1-8b-instruct)
#   - ORS_API_KEY              (tùy chọn, OpenRouteService routing)
#   - ADZUNA_APP_ID, ADZUNA_APP_KEY (tùy chọn, thị trường việc làm)

app_port: 7680
dockerfile_path: ./Dockerfile
build_kwargs: {}
