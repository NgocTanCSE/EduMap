# Render Blueprint — EduMap (free tier)
# Deploy: Render Dashboard → New → Blueprint → chọn repo này.
# Sau khi tạo, điền các biến có `sync: false` trong tab Environment.
#
# Build context (Render Blueprint): mỗi service có `rootDir: <thư mục>` →
# Render lấy chính thư mục đó làm Docker build context, vì vậy `dockerfilePath`
# (`./Dockerfile`) là tương đối với thư mục đó, và mọi dòng `COPY` trong
# Dockerfile phải dựa vào `backend/` (hoặc `ai-service/`).
#
# Gate biên dịch: GitHub Actions `.github/workflows/backend-build.yml`
# `cargo check --release --target x86_64-unknown-linux-musl` (musl-tools).
# Render build ảnh từ Dockerfile này.
# ---------------------------------------------------------------------------

services:
  # --------------------------------------------------------------- Rust API
  - type: web
    name: edumap-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Port / runtime (Rust: BACKEND_PORT, mặc định 3000) ---
      - key: BACKEND_PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_DEV_LOGIN
        value: "true"
      - key: DEV_USER_EMAIL
        value: dev@edumap.vn

      # --- Database (Supabase, session pooler) ---
      - key: DB_TYPE
        value: postgres
      - key: DB_SYNC
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres

      # --- Service-to-service (mạng nội bộ Render) ---
      # Rust: AI_SERVICE_URL (FastAPI 8000), ROUTING_SERVICE_URL (OSRM/ORS)
      # — thay thế `OSRM_URL` (NestJS cũ) bằng ROUTING_SERVICE_URL (Rust).
      - key: AI_SERVICE_URL
        value: http://edumap-ai:8000
      - key: ROUTING_SERVICE_URL
        value: https://router.project-osrm.org

      # --- AI provider keys (tuỳ chọn) ---
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false

  # ------------------------------------------------------------- FastAPI (AI)
  - type: web
    name: edumap-ai
    runtime: docker
    plan: free
    region: singapore
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"

      # --- Database (cùng Supabase) ---
      - key: DB_TYPE
        value: postgres
      - key: DB_SYNC
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres

      # --- Vector store (ephemeral trên Render) ---
      - key: CHROMA_DB_PATH
        value: /tmp/chroma_db
      - key: AUTO_SCHEDULER_ENABLED
        value: "false"

      # --- AI provider keys (tuỳ chọn) ---
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
