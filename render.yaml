# Render Blueprint — EduMap (free tier)
#
# Cấu hình dịch vụ: Render đang dùng Blueprint `render.yaml` → Dashboard
# tự tạo 2 service (edumap-api / edumap-ai) nếu chưa tồn tại.
#
# Cách deploy chính thức (2026-11-11): GitHub Actions →
#   `.github/workflows/render-deploy.yml`
#   • trigger: `push` lên `main` + `workflow_dispatch`
#   • dùng Render CLI (render deploys create) → Render build cho bạn
#   • Đợi build + restart xong, smoke test (xem `scripts/smoke_render.sh`).
#
# QUAN TRỌNG: Tắt Auto-Deploy trong Render Dashboard của 2 service
# (Settings -> Build and Deploy -> Auto-Deploy: OFF) để chỉ GitHub Actions
# thực thi deploy, tránh 2 deploy đua nhau (racing) trên cùng một service.
# ---------------------------------------------------------------------------

services:
  # --------------------------------------------------------------- Rust API
  - type: web
    name: edumap-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # --- Port / runtime (Rust: BACKEND_PORT, mặc định 3000) ---
      - key: BACKEND_PORT
        value: "3000"
      # KHÔNG dùng generateValue: FE trên Vercel verify JWT bằng cùng secret
      # (`frontend/src/lib/auth-utils.ts`), secret ngẫu nhiên → mọi route
      # requireAuth() trả 401. Điền đúng giá trị đã đặt trên Vercel.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_DEV_LOGIN
        value: "true"
      - key: DEV_USER_EMAIL
        value: dev@edumap.vn

      # --- Database (Supabase, session pooler) ---
      - key: DB_TYPE
        value: postgres
      - key: DB_SYNC
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres

      # --- Service-to-service (mạng nội bộ Render) ---
      # Rust: AI_SERVICE_URL (FastAPI 8000), ROUTING_SERVICE_URL (OSRM/ORS)
      # — thay thế `OSRM_URL` (NestJS cũ) bằng ROUTING_SERVICE_URL (Rust).
      - key: AI_SERVICE_URL
        value: http://edumap-ai:8000
      - key: ROUTING_SERVICE_URL
        value: https://router.project-osrm.org

      # --- AI provider keys (tuỳ chọn) ---
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Dùng chung với Vercel (BFF app/api/career/jobs) — career trends cần cả 2.
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false

  # ------------------------------------------------------------- FastAPI (AI)
  - type: web
    name: edumap-ai
    runtime: docker
    plan: free
    region: singapore
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

      # --- Database (cùng Supabase) ---
      - key: DB_TYPE
        value: postgres
      - key: DB_SYNC
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres

      # --- Vector store (ephemeral trên Render) ---
      - key: CHROMA_DB_PATH
        value: /tmp/chroma_db
      - key: AUTO_SCHEDULER_ENABLED
        value: "false"

      # --- AI provider keys (tuỳ chọn) ---
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
