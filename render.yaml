# Render Blueprint — EduMap (free tier)
#
# Cấu hình dịch vụ: Render đang dùng Blueprint `render.yaml` → Dashboard
# tự tạo 2 service (edumap-api / edumap-ai) nếu chưa tồn tại.
#
# Cách deploy chính thức: GitHub Actions build image → đẩy lên GHCR →
#   `.github/workflows/render-deploy.yml`
#   • trigger: `push` lên `main` + `workflow_dispatch`
#   • build 2 image (edumap-api / edumap-ai) rồi push lên GHCR
#   • dùng Render CLI (render deploys create --image) → Render pull image
#     vừa build ra deploy, không tự build lại từ Dockerfile
#   • Đợi deploy + restart xong, smoke test (xem `scripts/smoke_render.sh`).
#
# QUAN TRỌNG: Tắt Auto-Deploy trong Render Dashboard của 2 service
# (Settings -> Build and Deploy -> Auto-Deploy: OFF) để chỉ GitHub Actions
# thực thi deploy, tránh 2 deploy đua nhau (racing) trên cùng một service.
# ---------------------------------------------------------------------------

services:
  # --------------------------------------------------------------- Rust API
  - type: web
    name: edumap-api
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/ngoctancse/edumap-api:latest
    healthCheckPath: /api/health
    envVars:
      # --- Port / runtime (Rust: BACKEND_PORT, mặc định 3000) ---
      - key: BACKEND_PORT
        value: "3000"
      # KHÔNG dùng generateValue: FE trên Vercel verify JWT bằng cùng secret
      # (`frontend/src/lib/auth-utils.ts`), secret ngẫu nhiên → mọi route
      # requireAuth() trả 401. Điền đúng giá trị đã đặt trên Vercel.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_DEV_LOGIN
        value: "true"
      - key: DEV_USER_EMAIL
        value: dev@edumap.vn

      # --- Database (Supabase, session pooler) ---
      - key: DB_TYPE
        value: postgres
      - key: DB_SYNC
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres

      # --- Service-to-service ---
      # Web services trên gói FREE chỉ GỬI được request qua private network,
      # KHÔNG nhận được (Render docs: "Free web services can send private
      # network requests, but they can't receive them"). Vì vậy
      # AI_SERVICE_URL phải dùng public URL của edumap-ai, không dùng
      # `http://edumap-ai:8000` (sẽ timeout 12s rồi 500/502).
      - key: AI_SERVICE_URL
        value: https://edumap-ai-0xlt.onrender.com
      - key: ROUTING_SERVICE_URL
        value: https://router.project-osrm.org

      # --- AI provider keys (tuỳ chọn) ---
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Dùng chung với Vercel (BFF app/api/career/jobs) — career trends cần cả 2.
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false

  # ------------------------------------------------------------- FastAPI (AI)
  - type: web
    name: edumap-ai
    runtime: image
    plan: free
    region: singapore
    image:
      url: ghcr.io/ngoctancse/edumap-ai:latest
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

      # --- Database (cùng Supabase) ---
      - key: DB_TYPE
        value: postgres
      - key: DB_SYNC
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: postgres

      # --- Vector store (ephemeral trên Render) ---
      - key: CHROMA_DB_PATH
        value: /tmp/chroma_db
      - key: AUTO_SCHEDULER_ENABLED
        value: "false"

      # --- AI provider keys (tuỳ chọn) ---
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OWM_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
