# Cross-compile to a fully static musl binary so the runtime image can be
# any glibc/musl base (node:20-slim on host) without libpq or other
# system deps — sqlx's postgres driver is pure Rust (tls-rustls).
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
ar = "musl-ar"

[build]
# Render's free-tier build VM is 1 vCPU / ~2-4 GB RAM: keep one job in flight so
# `cargo build ` doesn't OOM-kill itself (the Rust binary is ~200 MB static,
# but building ~30 crates in parallel eats GBs).
jobs = 1