[package]
name = "edumap-backend"
version = "1.0.0"
edition = "2021"
description = "EduMap backend â replaced NestJS with axum/sqlx (Rust) on port 3000."

[dependencies]
# --- HTTP server -------------------------------------------------------------
axum = { version = "0.8", features = ["json", "multipart", "query", "tokio"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "timeout"] }

# --- Runtime ----------------------------------------------------------------
tokio = { version = "1", features = ["full"] }

# --- Database ---------------------------------------------------------------
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono", "json", "migrate"] }

# --- Serialization ----------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Authentication ---------------------------------------------------------
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std", "alloc"] }
validator = { version = "0.19", features = ["derive"] }

# --- Client -----------------------------------------------------------------
bytes = "1"
reqwest = { version = "0.12", features = ["stream", "gzip", "json", "socks"] }
aws-sdk-s3 = "1"

# --- hyper (the reqwest/axum base; used to collect the request body for the
#     ai-service proxy).
hyper = { version = "1", features = ["full"] }

# --- Mail -------------------------------------------------------------------
lettre = { version = "0.11", features = ["smtp", "tokio", "rustls-tls"] }

# --- Cache ------------------------------------------------------------------
moka = { version = "0.12", features = ["async"] }
redis = { version = "0.27", features = ["tokio", "tokio-comp"] }

# --- PDF (chứng nhận) --------------------------------------------------------
printpdf = { version = "0.5.2", features = ["embedded_images"] }
image = "0.23"
qrcode = "0.12.0"

# --- Observability ----------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sentry = { version = "0.34", features = ["tower", "tracing"] }
sentry-tower = "0.34"

# --- Docs -------------------------------------------------------------------
utoipa = { version = "5", features = ["axum", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# --- Scheduling -------------------------------------------------------------
# (tokio-cron REMOVED 2026-11-12 — unused by any module; pin remove
# prevents `cargo fetch` from failing on crates.io 0.5.x availability)
# --- Utilities --------------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
once_cell = "1"
lazy_static = "1"
regex = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
debug = true
