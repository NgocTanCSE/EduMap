[package]
name = "edumap-backend"
version = "1.0.0"
edition = "2021"
description = "EduMap backend â replaced NestJS with axum/sqlx (Rust) on port 3000."

[dependencies]
# --- HTTP server -------------------------------------------------------------
axum = { version = "0.8", features = ["json", "multipart", "query", "tokio"] }
tower = { version = "0.5", features = ["full"] }

# --- Runtime ----------------------------------------------------------------
tokio = { version = "1", features = ["full"] }

# --- Database ---------------------------------------------------------------
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "uuid", "chrono", "json", "migrate"] }

# --- Serialization ----------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Authentication ---------------------------------------------------------
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std", "alloc"] }

# --- Client -----------------------------------------------------------------
bytes = "1"
reqwest = { version = "0.12", features = ["stream", "gzip", "json", "socks"] }

# --- hyper (the reqwest/axum base; used to collect the request body for the
#     ai-service proxy).
hyper = { version = "1", features = ["full"] }

# --- Mail -------------------------------------------------------------------

# --- Cache ------------------------------------------------------------------

# --- PDF (chứng nhận) --------------------------------------------------------
printpdf = { version = "0.5.2", features = ["embedded_images"] }
image = "0.23"
qrcode = "0.12.0"

# --- Observability ----------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Docs -------------------------------------------------------------------
# (utoipa + swagger-ui bị xóa 2026-11-12: không module nào `use utoipa`;
#  feature `axum` không tồn tại trên utoipa v5 → `cargo fetch` fail
#  trên Render build)

# --- Scheduling -------------------------------------------------------------
# (tokio-cron REMOVED 2026-11-12 — unused by any module; pin remove
# prevents `cargo fetch` from failing on crates.io 0.5.x availability)
# --- Utilities --------------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
once_cell = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = 2
lto = true
panic = "abort"
debug = true
