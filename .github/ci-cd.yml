name: EduMap CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # === Stage 1: Build & Test ===
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: edumap
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: edumap_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install psycopg2-binary
        # sqlite3 is a built-in Python module — no pip install needed

      - name: Generate SQLite DB (PostgreSQL → SQLite migration)
        run: |
          python scripts/migrate-pg-to-sqlite.py \
            --pg-host 127.0.0.1 --pg-port 5433 \
            --pg-db edumap_db --pg-user edumap --pg-password password123 \
            --output frontend/public/edumap.db

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Build backend
        run: npx nest build
        working-directory: backend

      - name: Install frontend deps
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Run frontend type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://localhost:3000/api

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: edumap-db
          path: frontend/public/edumap.db
          retention-days: 7

      - name: Set up Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.82.0
          source "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-musl
          echo "RUSTC: $(rustc --version)"

      - name: Rust backend compile check (musl)
        run: |
          cd backend
          CARGO_BUILD_JOBS=2 cargo check --release --target x86_64-unknown-linux-musl 2>&1 | tee /tmp/check.log
          grep -q "^error" /tmp/check.log \
            && { echo "COMPILE FAILED"; exit 1; } \
            || echo "COMPILE OK"

      - name: Python AI service tests
        run: |
          cd ai-service && python3 -m pytest tests -q
