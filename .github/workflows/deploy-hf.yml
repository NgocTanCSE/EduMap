name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install HuggingFace tools
        run: pip install --upgrade huggingface_hub

      - name: Clean up stale files on HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── Delete files on HF Space that no longer exist locally ──
          #
          # `hf upload` only ADDS/UPDATES — it NEVER deletes remote files.
          # If a file was deleted from git but exists on HF Space, it stays
          # there and causes Docker build errors (e.g. google-ai.service.ts
          # → "Cannot find module '@google/generative-ai'").
          #
          # This step compares remote files vs git-tracked files, deletes
          # any remote file that's no longer in the repo.
          python3 -c "
          from huggingface_hub import HfApi
          import subprocess, sys

          api = HfApi()
          repo_id = 'tancse2005/Edumap'
          repo_type = 'space'

          # List all files currently on HF Space
          try:
              remote_files = set(api.list_repo_files(repo_id, repo_type=repo_type))
          except Exception as e:
              print(f'  (Cannot list remote files: {e})')
              remote_files = set()

          # List all git-tracked files (local repo)
          result = subprocess.run(['git', 'ls-files'], capture_output=True, text=True)
          local_files = set(f for f in result.stdout.strip().split('\n') if f)

          # Compute stale files (remote but not local)
          stale = remote_files - local_files
          # Never delete .git files
          stale = {f for f in stale if not f.startswith('.git')}

          deleted = 0
          for f in sorted(stale):
              try:
                  api.delete_file(
                      path=f,
                      repo_id=repo_id,
                      repo_type=repo_type,
                      commit_message='chore: delete stale file (removed from repo)',
                  )
                  print(f'  🗑️  Deleted: {f}')
                  deleted += 1
              except Exception as e:
                  print(f'  ↺ Skipped: {f} ({e})')

          if deleted == 0:
              print('  ℹ️  No stale files to delete')
          else:
              print(f'  ✅ Deleted {deleted} stale file(s)')
          "

      - name: Upload to HuggingFace Space via HTTP API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── Upload all project files to HF Space ──
          #
          # Binary files are excluded by .huggingfaceignore:
          #   docs/, *.doc, *.docx, *.pdf, *.png, *.xlsx, *.puml, *.bin, etc.
          # Non-essential dirs excluded: mobile/, crawlers/, crawled_data/, etc.
          #
          # IMPORTANT: scripts/ MUST be included — the Dockerfile COPYs it
          # for supervisord to run the job crawler.
          #
          # HF_TOKEN is auto-detected by the `hf` CLI from env — no --token flag.
          # --exclude flags are belt-and-suspenders (also handled by .huggingfaceignore)
          hf upload tancse2005/Edumap . \
            --repo-type space \
            --exclude "docs/**" \
            --exclude "mobile/**"
