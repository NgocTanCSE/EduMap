name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install HuggingFace tools
        run: pip install --upgrade huggingface_hub

      - name: Clean up ALL stale files on HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── Delete files on HF Space that no longer exist locally ──
          #
          # `hf upload` only ADDS/UPDATES — it NEVER deletes remote files.
          # If a file was deleted from git but exists on HF Space, it stays
          # there and causes Docker build errors (e.g. google-ai.service.ts
          # → "Cannot find module '@google/generative-ai'").
          #
          # ALSO: edumap.db has been showing as 132 bytes on HF Space despite
          # being 1.3MB locally. This is because `hf upload .` (directory mode)
          # respects .gitignore which has `*.db` — even with the !exception,
          # huggingface_hub's parser may not honor it. We force-delete edumap.db
          # here so the upload_file() step below can replace it with the correct version.
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import subprocess, os

          api = HfApi()
          repo_id = 'tancse2005/Edumap'
          repo_type = 'space'

          # ── 1. List remote files on HF Space ──
          try:
              remote_files = set(api.list_repo_files(repo_id, repo_type=repo_type))
          except Exception as e:
              print(f'  ⚠️  Cannot list remote files: {e}')
              remote_files = set()

          # Normalize: strip leading slashes, strip whitespace
          remote_files = {f.lstrip('/').strip() for f in remote_files}
          print(f'  ℹ️  Remote files on HF Space: {len(remote_files)}')

          # ── 2. List local git-tracked files ──
          result = subprocess.run(['git', 'ls-files'], capture_output=True, text=True)
          local_files = set(f for f in result.stdout.strip().split('\n') if f)
          print(f'  ℹ️  Local tracked files: {len(local_files)}')

          # ── 3. Compute stale files (remote but not local) ──
          stale = remote_files - local_files
          stale = {f for f in stale if not f.startswith('.git') and f}

          # ── 4. Also explicitly delete known stale/problematic files ──
          # These files were deleted from the repo but may persist on HF Space.
          # If list_repo_files missed them, we still clean them up.
          known_stale = [
              'backend/src/services/google-ai.service.ts',
              'backend/backup_modules',
              'ai-service/app',
              'frontend/public/edumap.db',  # Force delete stale/corrupt version
          ]

          all_to_delete = stale | set(known_stale)
          # Re-check which ones are actually on the remote
          to_delete = {f for f in all_to_delete if f in remote_files or f.rstrip('/') in remote_files or any(r.startswith(f.rstrip('/') + '/') for r in remote_files)}

          print(f'  ℹ️  Stale files to delete: {len(to_delete)}')

          deleted = 0
          for f in sorted(to_delete):
              try:
                  api.delete_file(
                      path=f,
                      repo_id=repo_id,
                      repo_type=repo_type,
                      commit_message='chore: delete stale file (removed from repo)',
                  )
                  print(f'  🗑️  Deleted: {f}')
                  deleted += 1
              except Exception as e:
                  print(f'  ↺ Skipped: {f} ({e})')

          if deleted == 0:
              print('  ℹ️  No stale files to delete')
          else:
              print(f'  ✅ Deleted {deleted} stale file(s)')
          PYEOF

      - name: Upload SQLite database FIRST (bypasses .gitignore)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── CRITICAL: Upload edumap.db BEFORE `hf upload .` ──
          #
          # Root cause: `hf upload .` (directory mode) uses upload_folder()
          # which respects .gitignore. The repo's .gitignore has `*.db` which
          # can prevent edumap.db (1.3MB valid SQLite) from being uploaded,
          # even with the !frontend/public/*.db exception.
          #
          # upload_file() (single-file mode) does NOT respect .gitignore.
          # We upload edumap.db first so it's on HF Space before `hf upload .`
          # triggers the Docker rebuild.
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import os

          local_path = 'frontend/public/edumap.db'
          size = os.path.getsize(local_path)
          print(f'  ℹ️  Local edumap.db size: {size} bytes')

          api = HfApi()
          api.upload_file(
              path_or_fileobj=local_path,
              path_in_repo='frontend/public/edumap.db',
              repo_id='tancse2005/Edumap',
              repo_type='space',
              commit_message=f'chore: upload fresh edumap.db SQLite database ({size} bytes)',
          )
          print('  ✅ edumap.db uploaded (bypassed .gitignore)')
          PYEOF

      - name: Upload all other files via HTTP API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── Upload remaining project files to HF Space ──
          #
          # Binary files are excluded by .huggingfaceignore:
          #   docs/, *.doc, *.docx, *.pdf, *.png, *.xlsx, *.puml, *.bin, etc.
          # Non-essential dirs excluded: mobile/, crawlers/, crawled_data/, etc.
          #
          # IMPORTANT: scripts/ MUST be included — the Dockerfile COPYs it
          # for supervisord to run the job crawler.
          #
          # HF_TOKEN is auto-detected by the `hf` CLI from env — no --token flag.
          # edumap.db is NOT excluded by .gitignore here (already uploaded above).
          # If .gitignore blocks it, the file is already on HF Space from the step above.
          hf upload tancse2005/Edumap . \
            --repo-type space \
            --exclude "docs/**" \
            --exclude "mobile/**"
