name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install HuggingFace tools
        run: pip install --upgrade huggingface_hub

      - name: Verify local edumap.db is valid SQLite
        run: |
          python3 -c "
          import sqlite3, os
          f = 'frontend/public/edumap.db'
          size = os.path.getsize(f)
          print(f'  ℹ️  Local edumap.db: {size} bytes')
          conn = sqlite3.connect(f)
          n = conn.execute(\"SELECT count(*) FROM sqlite_master WHERE type='table'\").fetchone()[0]
          conn.close()
          print(f'  ℹ️  Tables: {n}')
          assert size > 100000, f'edumap.db too small: {size} bytes — expected >1MB'
          assert n > 0, 'edumap.db has no tables — invalid SQLite'
          print('  ✅ Local edumap.db is valid')
          "

      - name: Clean up stale files on HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── Delete files on HF Space that no longer exist locally ──
          #
          # `hf upload` only ADDS/UPDATES — it NEVER deletes remote files.
          # If a file was deleted from git but exists on HF Space, it stays
          # there and causes Docker build errors (e.g. google-ai.service.ts
          # → "Cannot find module '@google/generative-ai'").
          #
          # ALSO: edumap.db has been showing as 132 bytes on HF Space despite
          # being 1.3MB locally. We force-delete it here so the upload_file()
          # step below can replace it with the correct version.
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import subprocess, os

          api = HfApi()
          repo_id = 'tancse2005/Edumap'
          repo_type = 'space'

          # ── 1. List remote files on HF Space ──
          try:
              remote_files = set(api.list_repo_files(repo_id, repo_type=repo_type))
          except Exception as e:
              print(f'  ⚠️  Cannot list remote files: {e}')
              remote_files = set()

          remote_files = {f.lstrip('/').strip() for f in remote_files}
          print(f'  ℹ️  Remote files on HF Space: {len(remote_files)}')

          # ── 2. List local git-tracked files ──
          result = subprocess.run(['git', 'ls-files'], capture_output=True, text=True)
          local_files = set(f for f in result.stdout.strip().split('\n') if f)
          print(f'  ℹ️  Local tracked files: {len(local_files)}')

          # ── 3. Compute stale files (remote but not local) ──
          stale = remote_files - local_files
          stale = {f for f in stale if not f.startswith('.git') and f}

          # ── 4. Known stale files (safety net) ──
          known_stale = [
              'backend/src/services/google-ai.service.ts',
              'backend/backup_modules',
              'ai-service/app',
              'frontend/public/edumap.db',
          ]

          all_to_delete = stale | set(known_stale)
          to_delete = {f for f in all_to_delete if f in remote_files or f.rstrip('/') in remote_files or any(r.startswith(f.rstrip('/') + '/') for r in remote_files)}

          print(f'  ℹ️  Stale files to delete: {len(to_delete)}')

          deleted = 0
          for f in sorted(to_delete):
              try:
                  api.delete_file(
                      path=f, repo_id=repo_id, repo_type=repo_type,
                      commit_message='chore: delete stale file (removed from repo)',
                  )
                  print(f'  🗑️  Deleted: {f}')
                  deleted += 1
              except Exception as e:
                  print(f'  ↺ Skipped: {f} ({e})')

          print(f'  ✅ Deleted {deleted} stale file(s)' if deleted else '  ℹ️  No stale files to delete')
          PYEOF

      - name: Upload SQLite database FIRST (bypasses .gitignore)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── CRITICAL: Upload edumap.db BEFORE `hf upload .` ──
          #
          # Root cause: `hf upload .` (directory mode) uses upload_folder()
          # which respects .gitignore. The repo's .gitignore has `*.db` which
          # may exclude edumap.db even with the !frontend/public/*.db exception,
          # because huggingface_hub's .gitignore parser ≠ git's parser.
          #
          # upload_file() (single-file mode) does NOT respect .gitignore.
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import os, sys

          local_path = 'frontend/public/edumap.db'
          size = os.path.getsize(local_path)
          print(f'  ℹ️  Local edumap.db size: {size} bytes')

          if size < 100000:
              print(f'  ❌ CRITICAL: Local edumap.db is only {size} bytes — expected >1MB!')
              sys.exit(1)

          api = HfApi()
          api.upload_file(
              path_or_fileobj=local_path,
              path_in_repo='frontend/public/edumap.db',
              repo_id='tancse2005/Edumap',
              repo_type='space',
              commit_message=f'chore: upload fresh edumap.db SQLite ({size} bytes)',
          )
          print('  ✅ edumap.db uploaded (bypassed .gitignore)')
          PYEOF

      - name: Upload all other files (excludes edumap.db + binary)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── Upload remaining project files to HF Space ──
          #
          # IMPORTANT: edumap.db is EXCLUDED here — it was already uploaded
          # via upload_file() above. If `hf upload .` also picks it up via
          # .gitignore exception, it uploads the SAME 1.3MB file (no harm).
          # But if .gitignore blocks it, the file is already correct from above.
          # Adding explicit --exclude as belt-and-suspenders.
          #
          # Binary files excluded by .huggingfaceignore: docs/, *.doc, etc.
          # scripts/ MUST be included (Dockerfile COPYs it for supervisord).
          hf upload tancse2005/Edumap . \
            --repo-type space \
            --exclude "docs/**" \
            --exclude "mobile/**" \
            --exclude "frontend/public/edumap.db"
