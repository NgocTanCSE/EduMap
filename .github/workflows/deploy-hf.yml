name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install HuggingFace tools
        run: pip install --upgrade huggingface_hub

      # ─────────────────────────────────────────────────────────
      # PRE-FLIGHT: Verify local edumap.db is the correct 1.3MB file
      # ─────────────────────────────────────────────────────────
      - name: Verify local edumap.db is valid SQLite
        run: |
          python3 -c "
          import sqlite3, os
          f = 'frontend/public/edumap.db'
          size = os.path.getsize(f)
          print(f'  ℹ️  Local edumap.db: {size} bytes')
          conn = sqlite3.connect(f)
          n = conn.execute(\"SELECT count(*) FROM sqlite_master WHERE type='table'\").fetchone()[0]
          conn.close()
          print(f'  ℹ️  Tables: {n}')
          assert size > 100000, f'edumap.db too small: {size} bytes — expected >1MB'
          assert n > 0, 'edumap.db has no tables — invalid SQLite'
          print('  ✅ Local edumap.db is valid')
          "

      # ─────────────────────────────────────────────────────────
      # STEP 1: Clean up stale files on HF Space
      # ─────────────────────────────────────────────────────────
      - name: Clean up stale files on HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Delete files on HF Space that no longer exist locally.
          # `hf upload` only ADDS/UPDATES — it NEVER deletes remote files.
          # Stale files cause Docker build errors (e.g. google-ai.service.ts).
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import subprocess

          api = HfApi()
          repo_id = 'tancse2005/Edumap'
          repo_type = 'space'

          # List remote files
          try:
              remote_files = set(api.list_repo_files(repo_id, repo_type=repo_type))
          except Exception as e:
              print(f'  ⚠️  Cannot list remote files: {e}')
              remote_files = set()
          remote_files = {f.lstrip('/').strip() for f in remote_files}
          print(f'  ℹ️  Remote files on HF Space: {len(remote_files)}')

          # List local git-tracked files
          result = subprocess.run(['git', 'ls-files'], capture_output=True, text=True)
          local_files = set(f for f in result.stdout.strip().split('\n') if f)
          print(f'  ℹ️  Local tracked files: {len(local_files)}')

          # Compute stale files (remote but not local)
          stale = remote_files - local_files
          stale = {f for f in stale if not f.startswith('.git') and f}

          # Known stale files (safety net — in case list_repo_files missed them)
          known_stale = [
              'backend/src/services/google-ai.service.ts',
              'backend/backup_modules',
              'ai-service/app',
          ]
          all_to_delete = stale | set(known_stale)
          to_delete = {f for f in all_to_delete if f in remote_files or f.rstrip('/') in remote_files or any(r.startswith(f.rstrip('/') + '/') for r in remote_files)}

          print(f'  ℹ️  Stale files to delete: {len(to_delete)}')

          deleted = 0
          for f in sorted(to_delete):
              try:
                  api.delete_file(
                      path=f, repo_id=repo_id, repo_type=repo_type,
                      commit_message='chore: delete stale file (removed from repo)',
                  )
                  print(f'  🗑️  Deleted: {f}')
                  deleted += 1
              except Exception as e:
                  print(f'  ↺ Skipped: {f} ({e})')

          print(f'  ✅ Deleted {deleted} stale file(s)' if deleted else '  ℹ️  No stale files to delete')
          PYEOF

      # ─────────────────────────────────────────────────────────
      # STEP 2: Push ALL tracked files via git push (with git-lfs DISABLED)
      # ─────────────────────────────────────────────────────────
      # ROOT CAUSE ANALYSIS:
      # - upload_file() via HF HTTP API can convert binary files (.db)
      #   into git-lfs pointers (132 bytes) even when < 10MB threshold.
      # - hf upload . (upload_folder) respects .gitignore which has
      #   `*.db` pattern, causing inconsistent behavior.
      # - Solution: use git push with git-lfs filter DISABLED.
      #   This stores ALL binary files (including edumap.db at 1.3MB)
      #   as regular git blobs in the HF Space git repo.
      # - git push also handles stale file cleanup automatically:
      #   files in local branch but not in remote are removed.
      # ──
      - name: Push all tracked files via git (git-lfs disabled)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          # Disable git-lfs to prevent binary files being stored as
          # git-lfs pointers (which would result in 132-byte pointers
          # instead of the actual 1.3MB SQLite file)
          git lfs uninstall
          git config --global filter.lfs.required false
          git config --global filter.lfs.clean cat
          git config --global filter.lfs.smudge cat

          git config --global user.email "ci@edumap.vn"
          git config --global user.name "EduMap CI"

          # Add HF Space as git remote
          git remote add hf-space "https://tancse2005:${HF_TOKEN}@huggingface.co/spaces/tancse2005/Edumap"

          # Force-push local main branch to HF Space main
          # --force overwrites the remote branch entirely, which means:
          #   + edumap.db (1.3MB tracked file) is pushed as regular git blob
          #   + stale files not in local repo are automatically removed
          git push hf-space main --force

          echo "  ✅ Git push to HF Space complete"

      # ─────────────────────────────────────────────────────────
      # STEP 3: Verify edumap.db on HF Space is correct
      # ─────────────────────────────────────────────────────────
      - name: Verify edumap.db on HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          from huggingface_hub import hf_hub_download
          import os, sys, sqlite3

          # Download edumap.db from HF Space
          downloaded = hf_hub_download(
              repo_id='tancse2005/Edumap',
              repo_type='space',
              filename='frontend/public/edumap.db',
          )
          size = os.path.getsize(downloaded)
          print(f'  ℹ️  Remote edumap.db size: {size} bytes')

          if size < 100000:
              print(f'  ❌ CRITICAL: edumap.db on HF Space is only {size} bytes — expected >1MB!')
              with open(downloaded, 'rb') as f:
                  content = f.read(200)
              print(f'  Content preview: {content}')
              sys.exit(1)

          # Verify it's valid SQLite
          conn = sqlite3.connect(downloaded)
          n = conn.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
          conn.close()
          print(f'  Tables: {n}')
          assert n > 0, 'No tables in remote edumap.db'
          print('  ✅ Remote edumap.db is valid SQLite')
          PYEOF
