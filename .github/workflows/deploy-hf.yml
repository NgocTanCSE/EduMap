name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install huggingface_hub (system Python — CLI auto on PATH)
        run: pip3 install --upgrade huggingface_hub

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload tancse2005/Edumap . \
            --repo-type space \
            --token "$HF_TOKEN"
          # .huggingfaceignore excludes node_modules/, .env, *.pdf, etc.
