name: Sync to Hugging Face space
on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Install dependencies
        run: pip install --upgrade huggingface_hub

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Upload to HuggingFace Space via HTTP API
          # Exclude documentation, videos, binary assets, and unused services
          # to comply with Hugging Face policies and keep the Space slim.
          # The root Dockerfile only needs: backend/, frontend/, ai-service/,
          # scripts/, infrastructure/, seed_crawled_data.sql, .env.hf.example
          hf upload tancse2005/Edumap . --repo-type space --token $HF_TOKEN \
            --exclude "docs/*" \
            --exclude "*.doc" \
            --exclude "*.docx" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "mobile/*" \
            --exclude "crawlers/*" \
            --exclude "crawled_data/*" \
            --exclude "data_raw/*" \
            --exclude "osrm-data/*" \
            --exclude ".kilo/*" \
            --exclude "tests/*" \
            --exclude "api/*"
