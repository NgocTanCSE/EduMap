name: Sync to Hugging Face space
on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Install dependencies
        run: pip install --upgrade huggingface_hub

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          
          # Upload to HuggingFace Space via HTTP API
          # (.huggingfaceignore skips binary docs like .docx/.doc/.png)
          hf upload tancse2005/Edumap . --repo-type space --token $HF_TOKEN
