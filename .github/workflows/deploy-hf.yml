name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Hugging Face Hub
        run: pip install --upgrade huggingface_hub

      - name: Sync to HuggingFace Space (upload + delete stale files)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # ── Sync local repo → HF Space via HTTP API ──
          #
          # We use `upload_folder(delete=True)` instead of `hf upload` because:
          #   `hf upload` only ADDS/UPDATES files — it NEVER deletes remote files
          #   that were removed locally. This caused a stale-file bug:
          #   google-ai.service.ts was deleted locally (replaced by
          #   cloudflare-ai.service.ts) but the OLD file stayed on HF Space,
          #   Docker `COPY backend/ ./` picked it up from cache → build failed
          #   with "Cannot find module '@google/generative-ai'".
          #
          # `upload_folder(delete=True)` properly syncs BOTH ways — uploads new
          # files AND deletes remote files that no longer exist locally.
          #
          # Exclusions:
          #   - .huggingfaceignore: excludes docs/, mobile/, *.doc, *.docx, etc.
          #   - exclude_patterns: extra safety for docs/** and mobile/**
          #
          # HF_TOKEN is auto-detected by huggingface_hub from the environment.
          python3 -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path='.',
              repo_id='tancse2005/Edumap',
              repo_type='space',
              exclude_patterns=['docs/**', 'mobile/**'],
              delete=True,       # ← CRITICAL: removes stale files from HF Space
              commit_message='chore: sync latest files to HF Space (delete=True)',
          )
          print('✅ Sync complete — all files uploaded, stale files deleted')
          "
