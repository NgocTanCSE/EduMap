name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub + ensure CLI on PATH
        run: |
          python3 -m pip install --upgrade huggingface_hub
          # Add the Python scripts dir to PATH (setup-python@v5 puts
          # huggingface-cli in a non-default location)
          SCRIPTS_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))")
          echo "$SCRIPTS_DIR" >> "$GITHUB_PATH"
          echo "huggingface-cli at: $(which huggingface-cli || echo 'NOT FOUND')"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload tancse2005/Edumap . \
            --repo-type space \
            --token "$HF_TOKEN"
          # .huggingfaceignore excludes node_modules/, .env, *.pdf, etc.
