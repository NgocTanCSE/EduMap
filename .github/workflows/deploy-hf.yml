name: Sync to Hugging Face space
on:
  push:
    branches: [main]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Install dependencies
        run: pip install "huggingface_hub[xet]"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          
          git remote add hf https://tancse2005:${HF_TOKEN}@huggingface.co/spaces/tancse2005/Edumap
          # Configure git user
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          # Integrate Xet for binary file storage (replaces Git LFS for .docx, .doc, .png, etc.)
          python -c "from huggingface_hub.xet import xet_git_config_path; print(xet_git_config_path())" | xargs -I {} git config --local include.path {}
          # Push to Hugging Face (Xet will handle binary files automatically)
          git push --force hf HEAD:main
