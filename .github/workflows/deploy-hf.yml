name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install HuggingFace tools
        run: pip install --upgrade huggingface_hub

      # ─────────────────────────────────────────────────────────
      # PRE-FLIGHT: Verify local edumap.db is the correct 1.3MB file
      # ─────────────────────────────────────────────────────────
      - name: Verify local edumap.db is valid SQLite
        run: |
          python3 -c "
          import sqlite3, os
          f = 'frontend/public/edumap.db'
          size = os.path.getsize(f)
          print(f'  ℹ️  Local edumap.db: {size} bytes')
          conn = sqlite3.connect(f)
          n = conn.execute(\"SELECT count(*) FROM sqlite_master WHERE type='table'\").fetchone()[0]
          conn.close()
          print(f'  ℹ️  Tables: {n}')
          assert size > 100000, f'edumap.db too small: {size} bytes'
          assert n > 0, 'edumap.db has no tables'
          print('  ✅ Local edumap.db is valid')
          "

      # ─────────────────────────────────────────────────────────
      # STEP 1: Clean up stale files on HF Space
      # ─────────────────────────────────────────────────────────
      - name: Clean up stale files on HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Delete files on HF Space that no longer exist locally.
          # `hf upload` only ADDS/UPDATES — it NEVER deletes remote files.
          # Stale files cause Docker build errors (e.g. google-ai.service.ts).
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import subprocess

          api = HfApi()
          repo_id = 'tancse2005/Edumap'
          repo_type = 'space'

          # List remote files
          try:
              remote_files = set(api.list_repo_files(repo_id, repo_type=repo_type))
          except Exception as e:
              print(f'  ⚠️  Cannot list remote files: {e}')
              remote_files = set()
          remote_files = {f.lstrip('/').strip() for f in remote_files}
          print(f'  ℹ️  Remote files on HF Space: {len(remote_files)}')

          # List local git-tracked files
          result = subprocess.run(['git', 'ls-files'], capture_output=True, text=True)
          local_files = set(f for f in result.stdout.strip().split('\n') if f)
          print(f'  ℹ️  Local tracked files: {len(local_files)}')

          # Compute stale files (remote but not local)
          stale = remote_files - local_files
          stale = {f for f in stale if not f.startswith('.git') and f}

          # Known stale files (safety net)
          known_stale = [
              'backend/src/services/google-ai.service.ts',
              'backend/backup_modules',
              'ai-service/app',
          ]
          all_to_delete = stale | set(known_stale)
          to_delete = {f for f in all_to_delete if f in remote_files or f.rstrip('/') in remote_files or any(r.startswith(f.rstrip('/') + '/') for r in remote_files)}

          print(f'  ℹ️  Stale files to delete: {len(to_delete)}')

          deleted = 0
          for f in sorted(to_delete):
              try:
                  api.delete_file(
                      path=f, repo_id=repo_id, repo_type=repo_type,
                      commit_message='chore: delete stale file (removed from repo)',
                  )
                  print(f'  🗑️  Deleted: {f}')
                  deleted += 1
              except Exception as e:
                  print(f'  ↺ Skipped: {f} ({e})')

          print(f'  ✅ Deleted {deleted} stale file(s)' if deleted else '  ℹ️  No stale files to delete')
          PYEOF

      # ─────────────────────────────────────────────────────────
      # STEP 2: Upload edumap.db via upload_file() (bypasses .gitignore)
      # ─────────────────────────────────────────────────────────
      # upload_file() (single-file mode) does NOT respect .gitignore.
      # This ensures edumap.db exists on HF Space so the Dockerfile COPY
      # command doesn't fail with "file not found".
      #
      # Even if upload_file() stores the file as a 132-byte git-lfs pointer
      # (HF API converts binary .db files), the Dockerfile's verify_db.py
      # will automatically download the correct 1.3MB from GitHub.
      - name: Upload edumap.db via upload_file (bypass .gitignore)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          from huggingface_hub import HfApi
          import os, sys

          local_path = 'frontend/public/edumap.db'
          size = os.path.getsize(local_path)
          print(f'  ℹ️  Local edumap.db size: {size} bytes')

          if size < 100000:
              print(f'  ❌ CRITICAL: Local edumap.db is only {size} bytes!')
              sys.exit(1)

          api = HfApi()
          api.upload_file(
              path_or_fileobj=local_path,
              path_in_repo='frontend/public/edumap.db',
              repo_id='tancse2005/Edumap',
              repo_type='space',
              commit_message=f'chore: upload edumap.db SQLite ({size} bytes)',
          )
          print('  ✅ edumap.db uploaded via upload_file()')
          PYEOF

      # ─────────────────────────────────────────────────────────
      # STEP 3: Upload all other project files
      # ─────────────────────────────────────────────────────────
      # Binary files are excluded by .huggingfaceignore (docs/, *.doc, etc.)
      # scripts/ MUST be included (Dockerfile COPYs verify_db.py from it)
      hf upload tancse2005/Edumap . \
        --repo-type space \
        --exclude "docs/**" \
        --exclude "mobile/**"

      # ─────────────────────────────────────────────────────────
      # STEP 4: Verify edumap.db on HF Space
      # ─────────────────────────────────────────────────────────
      # Download edumap.db from HF Space and verify it's valid.
      # If it's 132 bytes (git-lfs pointer), the Dockerfile's verify_db.py
      # will download from GitHub during build. This step just confirms
      # the file exists.
      - name: Verify edumap.db exists on HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          from huggingface_hub import hf_hub_download
          import os, sqlite3

          downloaded = hf_hub_download(
              repo_id='tancse2005/Edumap',
              repo_type='space',
              filename='frontend/public/edumap.db',
          )
          size = os.path.getsize(downloaded)
          print(f'  ℹ️  Remote edumap.db size: {size} bytes')

          if size > 1000000:
              # File looks correct — verify SQLite
              conn = sqlite3.connect(downloaded)
              n = conn.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
              conn.close()
              print(f'  Tables: {n}')
              print('  ✅ Remote edumap.db is valid SQLite')
          else:
              print(f'  ℹ️  Remote edumap.db is {size} bytes (< 1MB)')
              print('  ℹ️  Dockerfile verify_db.py will download from GitHub during build')
          PYEOF
