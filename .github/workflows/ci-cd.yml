name: EduMap CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Gate biên dịch + kiểm tra — không deploy, không tiết lộ secret.
permissions:
  contents: read
  actions: read

jobs:
  # === 2. AI service (FastAPI): unit tests ===
  ai-service-tests:
    name: AI service tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (app + test tooling)
        run: pip install -r ai-service/requirements.txt --no-cache-dir && pip install pytest --no-cache-dir

      - name: Run ai-service tests
        run: cd ai-service && python3 -m pytest tests -q

  # === 3. Frontend (Next.js/Vercel): type check + build ===
  frontend-check:
    name: Frontend type check + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm install --legacy-peer-deps --no-audit --no-fund --jobs=1
        working-directory: frontend

      - name: Run frontend type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: /api
