name: Build images and deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  prepare:
    name: Resolve image names
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build-api:
    name: Build edumap-api image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/edumap-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-ai:
    name: Build edumap-ai image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/edumap-ai
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  deploy:
    name: Deploy to Render
    needs: [prepare, build-api, build-ai]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate Render secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_API: ${{ secrets.RENDER_SERVICE_ID_API }}
          RENDER_SERVICE_ID_AI: ${{ secrets.RENDER_SERVICE_ID_AI }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo "### RENDER_API_KEY is MISSING"; exit 1; }
          test -n "$RENDER_SERVICE_ID_API" || { echo "### RENDER_SERVICE_ID_API is MISSING"; exit 1; }
          test -n "$RENDER_SERVICE_ID_AI" || { echo "### RENDER_SERVICE_ID_AI is MISSING"; exit 1; }
          echo "### Render secrets present"

      - name: Install Render CLI
        run: |
          set -euo pipefail
          version="v2.7.0"
          curl -sSfL \
            "https://github.com/render-oss/cli/releases/download/${version}/cli_2.7.0_linux_amd64.zip" \
            -o /tmp/render.zip
          unzip -q /tmp/render.zip -d /tmp/render
          sudo mv "/tmp/render/cli_${version}" /usr/local/bin/render
          render --version

      - name: Deploy api service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SRV: ${{ secrets.RENDER_SERVICE_ID_API }}
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/edumap-api:${{ github.sha }}
        run: |
          set -euo pipefail
          render deploys create "$SRV" --image "$IMAGE" --wait --confirm -o json > /tmp/api-deploy.json
          jq -r '.deploy.status' /tmp/api-deploy.json

      - name: Deploy ai service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SRV: ${{ secrets.RENDER_SERVICE_ID_AI }}
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/edumap-ai:${{ github.sha }}
        run: |
          set -euo pipefail
          render deploys create "$SRV" --image "$IMAGE" --wait --confirm -o json > /tmp/ai-deploy.json
          jq -r '.deploy.status' /tmp/ai-deploy.json

      - name: Smoke test
        env:
          API_URL: ${{ vars.RENDER_API_PUBLIC_URL || 'https://edumap-api.onrender.com' }}
          AI_URL: ${{ vars.RENDER_AI_PUBLIC_URL || 'https://edumap-ai.onrender.com' }}
        run: |
          set -euo pipefail
          for url in "$API_URL/api/health" "$AI_URL/health"; do
            code=""
            for i in $(seq 1 24); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then echo "OK  $url"; break; fi
              echo "  wait ($i/24) HTTP $code"
              sleep 5
            done
            if [ "$code" != "200" ]; then echo "TIMEOUT: $url"; exit 1; fi
          done

      - name: Dump recent logs on failure
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SRV_API: ${{ secrets.RENDER_SERVICE_ID_API }}
          SRV_AI: ${{ secrets.RENDER_SERVICE_ID_AI }}
        run: |
          echo "::group::edumap-api (last 100)"
          render logs -r "$SRV_API" --start 30m --limit 100 || true
          echo "::endgroup::"
          echo "::group::edumap-ai (last 100)"
          render logs -r "$SRV_AI" --start 30m --limit 100 || true
          echo "::endgroup::"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Render deploy"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- edumap-api: https://edumap-api.onrender.com"
            echo "- edumap-ai: https://edumap-ai.onrender.com"
          } >> "$GITHUB_STEP_SUMMARY"