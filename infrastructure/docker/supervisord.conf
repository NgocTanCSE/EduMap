[supervisord]
nodaemon=true
logfile=/data/supervisord.log
pidfile=/data/supervisord.pid

# NOTE: PostgreSQL and Redis are managed by system services (started in hf_entrypoint.sh).
# They are NOT managed by supervisord to avoid permission and daemonize conflicts.

[program:minio]
command=minio server /data/minio_data --console-address ":9001"
priority=100
autostart=true
autorestart=true
stdout_logfile=/data/minio.log
stderr_logfile=/data/minio.err
environment=MINIO_ROOT_USER="admin",MINIO_ROOT_PASSWORD="password123"

[program:backend]
command=bash /app/scripts/start_backend.sh
directory=/app/backend
priority=200
autostart=true
autorestart=true
startretries=50
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=NODE_ENV="production",DB_HOST="localhost",DB_PORT="5432",DB_USERNAME="admin",DB_PASSWORD="${DB_PASSWORD:-password123}",DB_DATABASE="edumap_db",DB_TYPE="postgres",DB_SYNC="false",REDIS_HOST="localhost",REDIS_PORT="6379",PORT="3001",MINIO_ACCESS_KEY="admin",MINIO_SECRET_KEY="password123",MINIO_ENDPOINT="localhost",MINIO_PORT="9000",AI_SERVICE_URL="http://127.0.0.1:8000",OSRM_URL="https://router.project-osrm.org",JWT_SECRET="${JWT_SECRET:-edumap-default-secret-key-change-in-production}",GEMINI_API_KEY="${GEMINI_API_KEY}",NEXT_PUBLIC_GOOGLE_CLIENT_ID="${NEXT_PUBLIC_GOOGLE_CLIENT_ID}",GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"

[program:ai-service]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/ai-service
priority=200
autostart=true
autorestart=true
startretries=10
stdout_logfile=/data/ai.log
stderr_logfile=/data/ai.err
environment=GEMINI_API_KEY="${GEMINI_API_KEY}",GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"

[program:frontend]
command=npm run start
directory=/app/frontend
priority=300
autostart=true
autorestart=true
startretries=10
stdout_logfile=/data/frontend.log
stderr_logfile=/data/frontend.err
environment=NODE_ENV="production",NEXT_PUBLIC_API_URL="/api",NEXT_PUBLIC_AI_API_URL="http://127.0.0.1:8000/api/ai",BACKEND_URL="http://127.0.0.1:3001",NEXT_PUBLIC_GOOGLE_CLIENT_ID="${NEXT_PUBLIC_GOOGLE_CLIENT_ID}",GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}"

[program:nginx]
command=nginx -g "daemon off;"
priority=900
autostart=true
autorestart=true
stdout_logfile=/data/nginx.log
stderr_logfile=/data/nginx.err


# Nightly countrywide POI crawler (chợ + Bách hóa Xanh / convenience stores).
# Sleeps until 00:30 local time, runs one crawl, then loops for the next night.
[program:crawl-pois-vietnam]
command=/bin/bash /app/scripts/run_crawl_pois_nightly.sh
directory=/app
priority=50
autostart=true
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DB_HOST="localhost",DB_PORT="5432",DB_USERNAME="admin",DB_DATABASE="edumap_db",DB_PASSWORD="password123"
