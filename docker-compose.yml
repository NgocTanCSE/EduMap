services:
  # --- INFRASTRUCTURE ---
  postgres:
    image: postgis/postgis:16-3.4
    container_name: edumap_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-seed schema + base data on a FRESH volume (docker-entrypoint-initdb.d).
      # Runs ONLY on first start of an empty data dir (safe: CREATE/INSERT only,
      # no DROP). Keeps backend from 500-ing on an empty DB after a fresh build.
      - ./backend/src/database/schema.sql:/edumap-init/01-schema.sql:ro
      - ./backend/src/database/seed.sql:/edumap-init/02-seed.sql:ro
      - ./seed_crawled_data.sql:/edumap-init/03-crawled.sql:ro
      - ./infrastructure/postgres/docker-entrypoint-initdb.d/00-edumap-init.sh:/docker-entrypoint-initdb.d/00-edumap-init.sh:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edumap_redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: edumap_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # --- REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: edumap_nginx
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT_EXTERNAL}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # --- APP SERVICES ---
  backend:
    build: ./backend
    container_name: edumap_backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_TYPE=postgres
      - DB_SYNC=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - AI_SERVICE_URL=http://ai-service:8000
      - OSRM_URL=http://osrm:5000
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PORT=3000
    # NO DIRECT PORTS - secure through Nginx
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: edumap_frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://backend:3000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    # NO DIRECT PORTS - secure through Nginx
    depends_on:
      - backend
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: edumap_ai
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_MODEL=${CLOUDFLARE_MODEL:-@cf/meta/llama-3.1-8b-instruct-fp8}
      - CLOUDFLARE_EMBEDDING_MODEL=${CLOUDFLARE_EMBEDDING_MODEL:-@cf/baai/bge-base-en-v1.5}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - chroma_db_data:/app/chroma_db
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: unless-stopped

  db-init:
    image: python:3.11-slim
    container_name: edumap_db_init
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    command: >
      sh -c "pip install psycopg2-binary python-dotenv && 
             python scripts/execute_db_setup.py"
    depends_on:
      postgres:
        condition: service_started
    profiles:
      - init # Chạy bằng lệnh: docker-compose --profile init up

  # --- SCHEDULER: nationwide crawler (daily 00:00:00) ---
  crawler:
    build:
      context: .
      dockerfile: crawlers/Dockerfile
    container_name: edumap_crawler
    env_file: .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - EDUMAP_CRAWLER_BOOT_RUN=1   # refresh once when container starts (best-effort)
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  # --- MONITORING SERVICES ---
  prometheus:
    image: prom/prometheus:latest
    container_name: edumap_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT_EXTERNAL}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: edumap_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    restart: unless-stopped

  # --- ROUTING SERVICE (OSRM) ---
  osrm:
    image: osrm/osrm-backend:latest
    container_name: edumap_osrm
    volumes:
      - ./osrm-data:/data
    command: >
      sh -c "
        if [ ! -f /data/vietnam-latest.osrm ]; then
          echo 'Preprocessing OSM data...' &&
          osrm-extract -p /opt/car.lua /data/vietnam-latest.osm.pbf &&
          osrm-partition /data/vietnam-latest.osrm &&
          osrm-customize /data/vietnam-latest.osrm
        fi &&
        osrm-routed --algorithm mld /data/vietnam-latest.osrm
      "
    ports:
      - "5000:5000"
    restart: unless-stopped

  # --- MOBILE WEB ---
  mobile:
    build: ./mobile
    container_name: edumap_mobile
    environment:
      - EXPO_PUBLIC_API_BASE_URL=http://localhost:80/api
    ports:
      - "3005:3005"
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  chroma_db_data:
